[package]
name = "stripe_demo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.14.*", features = ["unstable"] }
sha2 = "0.10"
hmac = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
