[package]
name = "agents_demo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.14.*", features = ["unstable"] }
sha2 = "0.10"
hmac = "0.12"
http = "1"
log = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
scrypt = { version = "0.11", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
