name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: C#
        env:
          EXPERIMENTAL_WASM_AOT: 1   # what `spacetime build` sets for NativeAOT-LLVM (net10.0) projects
        run: for p in crypto retry rate-limit cron presence api-keys grid lobby resend stripe posthog auth files agents; do dotnet build $p/demo/csharp -c Release; done
      - name: The embedded time-zone table is in sync with its generator
        run: |
          python3 tools/gen-tz.py
          git diff --stat --exit-code -- cron/rust/cron.rs cron/csharp/Cron.cs || echo "::warning::the runner's tzdata differs from the committed table (that's fine; the table is pinned)"

  # Every package in every language against the same test suite.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [crypto, retry, rate-limit, cron, presence, api-keys, grid, lobby, files]
        lang: [rust, csharp]
    name: e2e (${{ matrix.package }}, ${{ matrix.lang }})
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        if: matrix.lang == 'rust'
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.lang == 'rust'
      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start SpacetimeDB
        run: |
          nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - run: scripts/e2e.sh ${{ matrix.package }} ${{ matrix.lang }}
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true

  # A standalone built with SpacetimeDB's own `allow_loopback_http_for_tests` feature, cached per
  # version: the integration ports send HTTP to mock APIs on 127.0.0.1, which a stock server refuses.
  dev-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: ver
        run: echo "version=$(spacetime --version | sed -n 's/.*tool version \([0-9.]*\);.*/\1/p')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: .dev-server/spacetimedb-standalone-${{ steps.ver.outputs.version }}
          key: dev-server-${{ runner.os }}-${{ steps.ver.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          scripts/dev-server.sh build
          rm -rf .dev-server/SpacetimeDB-*

  # The ports that send HTTP, each against its mock (resend :4201, stripe :4202, posthog :4203, auth's OAuth
  # provider :4310, agents' model providers :4320).
  e2e-http:
    needs: dev-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [resend, stripe, posthog, auth, agents]
        lang: [rust, csharp]
    name: e2e (${{ matrix.package }}, ${{ matrix.lang }})
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        if: matrix.lang == 'rust'
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.lang == 'rust'
      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .dev-server/spacetimedb-standalone-${{ needs.dev-server.outputs.version }}
          key: dev-server-${{ runner.os }}-${{ needs.dev-server.outputs.version }}
          fail-on-cache-miss: true
      - name: Start SpacetimeDB (loopback HTTP allowed)
        run: |
          mkdir -p ~/.config/spacetime
          nohup scripts/dev-server.sh start > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - run: scripts/e2e.sh ${{ matrix.package }} ${{ matrix.lang }}
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true

  # The Rust and C# ports of each package expose the same schema.
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [crypto, retry, rate-limit, cron, presence, api-keys, grid, lobby, resend, stripe, posthog, auth, files, agents]
    name: parity (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start SpacetimeDB
        run: |
          nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - run: scripts/parity.sh ${{ matrix.package }}
